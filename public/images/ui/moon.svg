<?xml version="1.0" encoding="UTF-8"?>
<!-- Pixel moon — the night counterpart of sun.svg, used as the plate a page
     header is written on.

     Same construction as the sun so the two read as one family: a 32x32 grid
     with the disc rasterised from a real circle (centre 16,16 — radius 13), one
     cell of rim over a flat body. A coarser grid turns the silhouette into an
     octagon; 32 cells reads as round and still steps at the edge.

     Tones come from the cloud ramp, in its own order: `cloud-shade` rim over a
     `cloud-mid` body, with `cloud-deep` craters. Ink on the body is
     `heraldry-royal` at about 9:1 — gold on a near-white disc is 1.7:1 and
     fails, which is the same rule the white header plate follows.

     The craters sit only in the top and bottom fifths, outside the y=9..23 band
     the header copy occupies, so they read as surface detail and never as a
     smudge behind text. Corona rays would say "sun", so the glare is four
     detached one-cell stars instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     shape-rendering="crispEdges">
  <g fill="#cfe6f5">
    <!-- rim: the full circle, r=13 -->
    <rect x="12" y="3" width="8" height="1" />
    <rect x="10" y="4" width="12" height="1" />
    <rect x="8" y="5" width="16" height="1" />
    <rect x="7" y="6" width="18" height="1" />
    <rect x="6" y="7" width="20" height="1" />
    <rect x="5" y="8" width="22" height="2" />
    <rect x="4" y="10" width="24" height="2" />
    <rect x="3" y="12" width="26" height="8" />
    <rect x="4" y="20" width="24" height="2" />
    <rect x="5" y="22" width="22" height="2" />
    <rect x="6" y="24" width="20" height="1" />
    <rect x="7" y="25" width="18" height="1" />
    <rect x="8" y="26" width="16" height="1" />
    <rect x="10" y="27" width="12" height="1" />
    <rect x="12" y="28" width="8" height="1" />
    <!-- stars: detached single cells, the night version of a corona -->
    <rect x="1" y="6" width="1" height="1" />
    <rect x="29" y="9" width="1" height="1" />
    <rect x="3" y="25" width="1" height="1" />
    <rect x="28" y="24" width="1" height="1" />
  </g>
  <g fill="#e8f4fb">
    <!-- body: the same circle inset by one cell, so the rim stays even -->
    <rect x="11" y="4" width="10" height="1" />
    <rect x="9" y="5" width="14" height="1" />
    <rect x="8" y="6" width="16" height="1" />
    <rect x="7" y="7" width="18" height="1" />
    <rect x="6" y="8" width="20" height="2" />
    <rect x="5" y="10" width="22" height="2" />
    <rect x="4" y="12" width="24" height="8" />
    <rect x="5" y="20" width="22" height="2" />
    <rect x="6" y="22" width="20" height="2" />
    <rect x="7" y="24" width="18" height="1" />
    <rect x="8" y="25" width="16" height="1" />
    <rect x="9" y="26" width="14" height="1" />
    <rect x="11" y="27" width="10" height="1" />
  </g>
  <g fill="#b8dcf0">
    <!-- craters: top and bottom fifths only, clear of the text band -->
    <rect x="10" y="6" width="3" height="2" />
    <rect x="9" y="8" width="2" height="1" />
    <rect x="18" y="5" width="2" height="2" />
    <rect x="21" y="8" width="3" height="2" />
    <rect x="12" y="24" width="2" height="2" />
    <rect x="17" y="25" width="4" height="2" />
    <rect x="8" y="22" width="2" height="1" />
  </g>
</svg>
